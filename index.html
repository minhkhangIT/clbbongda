<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Team Balancer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>CLB Bóng Đá ⚽</h1>
    <div id="currentDate" class="date-display"></div>

    <div class="stats-bar">
        <div class="stat-item">Tổng cầu thủ: <span id="totalPlayers">0</span></div>
        <div class="stat-item">Tổng điểm danh: <span id="availablePlayers">0</span></div>
    </div>

    <div class="input-card">
        <div class="input-field-group">
            <input type="text" id="playerName" placeholder="Nhập tên cầu thủ...">
        </div>
        
        <div class="slider-wrapper">
            <div class="slider-label">Điểm đánh giá: <span id="scoreValue"><b>2.5</b></span></div>
            <input type="range" id="playerScore" min="0" max="5" step="0.25" value="2.5" oninput="updateScoreLabel(this.value)">
        </div>

        <button class="btn-add-full" onclick="addPlayer()">Thêm cầu thủ</button>
    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Nhập tìm cầu thủ..." onkeyup="filterTable()">
            <button class="btn-uncheck-all" onclick="uncheckAll()">Xóa điểm danh toàn bộ</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th onclick="sortPlayers('name')" style="cursor:pointer">Tên</th>
                    <th onclick="sortPlayers('pots')" style="cursor:pointer">Điểm</th>
                    <th onclick="sortPlayers('available')" style="cursor:pointer">Điểm danh</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>

    <button class="btn-divide" onclick="divideTeams()">Chia đội ngẫu nhiên 🎲</button>

    <div id="results" class="results-grid"></div>
</div>

<div id="deleteModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Xóa cầu thủ</h3>
        <p>Bạn muốn xóa cầu thủ này?</p>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Không</button>
            <button class="btn-danger" id="confirmDeleteBtn">Có</button>
        </div>
    </div>
</div>

<div id="editModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Sửa thông tin</h3>
        <div class="input-group-vertical">
            <label>Tên cầu thủ:</label>
            <input type="text" id="editPlayerName">
            
            <div class="slider-wrapper" style="padding: 10px 0;">
                <div class="slider-label">Điểm: <span id="editScoreValue">2.5</span></div>
                <input type="range" id="editPlayerScore" min="0" max="5" step="0.25" value="2.5" oninput="updateEditScoreLabel(this.value)">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeEditModal()">Hủy bỏ</button>
            <button class="btn-add" id="confirmEditBtn">Lưu thay đổi</button>
        </div>
    </div>
</div>
<div id="notification" class="notification"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
