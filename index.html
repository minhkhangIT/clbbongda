<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Team Balancer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>CLB Bóng Đá ⚽</h1>
    <div id="currentDate" class="date-display"></div>

    <div class="stats-bar">
        <div class="stat-item">Tổng cầu thủ: <span id="totalPlayers">0</span></div>
        <div class="stat-item">Tổng điểm danh: <span id="availablePlayers">0</span></div>
    </div>

    <div class="input-card">
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Nhập tên cầu thủ">
            <div class="select-container">
                <label>Hạt giống:</label>
                <select id="playerPots">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            <button class="btn-add" onclick="addPlayer()">Thêm cầu thủ</button>
        </div>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Tìm kiếm tên cầu thủ..." onkeyup="filterTable()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th onclick="sortPlayers('name')" style="cursor:pointer">Tên ↕</th>
                    <th onclick="sortPlayers('pots')" style="cursor:pointer">Hạt giống ↕</th>
                    <th onclick="sortPlayers('available')" style="cursor:pointer">Điểm danh ↕</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>

    <button class="btn-divide" onclick="divideTeams()">Chia đội ngẫu nhiên 🎲</i></button>

    <div id="results" class="results-grid"></div>
</div>

<div id="deleteModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Xóa cầu thủ</h3>
        <p>Bạn muốn xóa cầu thủ này?</p>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Không</button>
            <button class="btn-danger" id="confirmDeleteBtn">Có</button>
        </div>
    </div>
</div>

<div id="editModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Sửa thông tin</h3>
        <div class="input-group-vertical">
            <input type="text" id="editPlayerName" placeholder="Tên cầu thủ">
            <select id="editPlayerPots">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeEditModal()">Hủy</button>
            <button class="btn-add" id="confirmEditBtn">Lưu thay đổi</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
